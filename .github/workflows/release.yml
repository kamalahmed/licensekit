name: Build release zip

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          coverage: none
          tools: composer:v2

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --no-progress --no-interaction --optimize-autoloader

      - name: Determine version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Stage release files
        run: |
          mkdir -p build/licensekit
          rsync -a \
            --exclude='/.github' \
            --exclude='/.git' \
            --exclude='/.gitignore' \
            --exclude='/.phpunit.cache' \
            --exclude='/.phpunit.result.cache' \
            --exclude='/build' \
            --exclude='/coverage' \
            --exclude='/tests' \
            --exclude='/docs' \
            --exclude='/phpunit.xml.dist' \
            --exclude='/CONTRIBUTING.md' \
            --exclude='/SECURITY.md' \
            --exclude='/CHANGELOG.md' \
            --exclude='/_debug*' \
            ./ build/licensekit/

      - name: Create zip
        run: |
          cd build
          zip -rq ../licensekit-${{ steps.version.outputs.version }}.zip licensekit

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: licensekit-${{ steps.version.outputs.version }}
          path: licensekit-${{ steps.version.outputs.version }}.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: licensekit-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
